name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Bun for the sitemap prebuild
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b --pretty false

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
